<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hospital - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v=2">
</head>

<body class="login-page">
    <div class="container-fluid p-0">
        <div class="row g-0 login-split">
            <div class="col-lg-6 login-brand d-none d-lg-flex">
                <div class="login-brand-inner">
                    <div class="login-logo-wrap">
                        <img src="/static/images/shms-logo.svg" alt="Smart Hospital Management System logo"
                            class="login-brand-logo">
                    </div>
                    <h1 class="mb-3 text-center">Care that stays coordinated.</h1>
                    <p class="mb-4 fs-5 text-center" style="opacity:.85; max-width: 34rem; margin-inline:auto;">
                        One Place to Care, One Place to Share — Connecting Healthcare Everywhere.
                    </p>
                    <ul class="list-unstyled mb-0 mx-auto" style="opacity:.9; max-width: 30rem;">
                        <li class="mb-2"><span class="feature-dot"></span>Role-based dashboards</li>
                        <li class="mb-2"><span class="feature-dot"></span>Patient records and schedules</li>
                        <li><span class="feature-dot"></span>Team messaging over TCP sockets</li>
                    </ul>
                </div>
            </div>
            <div class="col-lg-6 login-panel">
                <div class="login-box">
                    <div class="text-center d-lg-none mb-3 fs-1">🏥</div>
                    <h2 class="text-center mb-1">Smart Hospital</h2>
                    <p class="text-center text-muted mb-4">Sign in to your care workspace</p>

                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-3"
                        role="alert">
                        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                        <div class="small fw-semibold">{{ error }}</div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}

                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input id="username" type="text" name="username" class="form-control"
                                    placeholder="Enter username" required value="{{ prefill_username|default('') }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input id="password" type="password" name="password" class="form-control"
                                    placeholder="Enter password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                    aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button class="btn btn-accent w-100" type="submit">Login</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById("togglePassword").addEventListener("click", function () {
            const input = document.getElementById("password");
            const icon = this.querySelector("i");
            const hidden = input.type === "password";
            input.type = hidden ? "text" : "password";
            icon.className = hidden ? "bi bi-eye-slash" : "bi bi-eye";
        });
    </script>
</body>

</html>
