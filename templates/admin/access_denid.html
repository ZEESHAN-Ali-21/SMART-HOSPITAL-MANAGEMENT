{% extends "base.html" %}
{% block title %}Access Denied - Smart Hospital{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card card-soft p-5 border-0 shadow-sm text-center">
            <div class="d-inline-flex p-4 rounded-circle bg-danger-subtle text-danger mb-4 mx-auto" style="width: 80px; height: 80px; align-items: center; justify-content: center;">
                <i class="bi bi-shield-x fs-1"></i>
            </div>
            <h3 class="mb-2">Access Denied</h3>
            <p class="text-muted mb-4">
                You do not have the necessary permissions to access this area. Your role is restricted to your authorized workspace.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/dashboard" class="btn btn-accent px-4 rounded-pill">
                    <i class="bi bi-arrow-left me-1"></i> Return to My Dashboard
                </a>
                <a href="/logout" class="btn btn-outline-secondary px-3 rounded-pill">
                    Logout
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
